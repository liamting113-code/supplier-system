<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>集團供應商管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

        // 1. 請填入你的 Firebase 配置
        const firebaseConfig = {
            apiKey: "BJqAVUco0zEucgcAZEzZRt9N6D7jXXrtMuMH1O9fsPMMNpNaXFwGKFwTiwKTWZU8b_Ee2x8ewcmxd8o_SzU4zYM",
            authDomain: "你的AUTH_DOMAIN",
            projectId: "你的PROJECT_ID",
            storageBucket: "你的STORAGE_BUCKET",
            messagingSenderId: "你的SENDER_ID",
            appId: "你的APP_ID"
        };

        // 初始化 Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 將功能掛載到 window 供 HTML 點擊事件使用
        window.api = { auth, db, signInWithEmailAndPassword, signOut, collection, addDoc, onSnapshot, doc, deleteDoc };

        // 監聽登入狀態
        onAuthStateChanged(auth, (user) => {
            const loginView = document.getElementById('login-view');
            const mainView = document.getElementById('main-view');
            const statusDot = document.getElementById('conn-status');
            
            if (user) {
                loginView.classList.add('hidden');
                mainView.classList.remove('hidden');
                statusDot.classList.replace('bg-red-500', 'bg-green-500');
                statusDot.title = "已連線至 Firebase: " + user.email;
                startDataSync();
            } else {
                loginView.classList.remove('hidden');
                mainView.classList.add('hidden');
                statusDot.classList.replace('bg-green-500', 'bg-red-500');
            }
        });
    </script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">
    <div id="app" class="min-h-screen flex flex-col">
        <!-- 登入界面 -->
        <div id="login-view" class="flex-grow flex items-center justify-center p-4">
            <div class="bg-white p-8 rounded-2xl shadow-xl border max-w-md w-full">
                <div class="flex flex-col items-center mb-6">
                    <div class="bg-blue-600 p-3 rounded-xl mb-4 text-white"><i data-lucide="shield-check" class="w-8 h-8"></i></div>
                    <h1 class="text-2xl font-bold">供應商管理系統</h1>
                </div>
                <form id="login-form" class="space-y-4">
                    <input type="email" id="email" required placeholder="電子郵件" class="w-full px-4 py-3 rounded-lg border outline-none focus:ring-2 focus:ring-blue-500">
                    <input type="password" id="password" required placeholder="密碼" class="w-full px-4 py-3 rounded-lg border outline-none focus:ring-2 focus:ring-blue-500">
                    <div id="login-error" class="text-red-500 text-xs hidden">登入失敗：請確認帳號已在 Firebase 建立且 Rules 已發布。</div>
                    <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700 transition">立即登入</button>
                </form>
            </div>
        </div>

        <!-- 主界面 -->
        <div id="main-view" class="hidden flex-grow flex flex-col">
            <nav class="bg-white border-b px-6 py-4 flex justify-between items-center sticky top-0 z-50">
                <div class="flex items-center gap-3">
                    <div id="conn-status" class="w-3 h-3 rounded-full bg-red-500" title="檢查連線中..."></div>
                    <span class="font-bold">集團查核系統</span>
                </div>
                <button onclick="handleLogout()" class="text-slate-400 hover:text-red-500"><i data-lucide="log-out" class="w-5 h-5"></i></button>
            </nav>

            <div class="p-6 max-w-4xl mx-auto w-full">
                <div class="bg-white p-6 rounded-xl border shadow-sm mb-6">
                    <h3 class="font-bold mb-4">快速新增</h3>
                    <div class="grid grid-cols-2 gap-4">
                        <input type="text" id="new-cn" placeholder="中文公司名" class="border p-2 rounded">
                        <input type="text" id="new-tags" placeholder="工種" class="border p-2 rounded">
                        <button onclick="saveData()" class="col-span-2 bg-blue-600 text-white py-2 rounded font-bold">儲存到雲端</button>
                    </div>
                </div>

                <div id="data-list" class="space-y-3">
                    <p class="text-center text-slate-400">載入中...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 登入動作
        document.getElementById('login-form').onsubmit = async (e) => {
            e.preventDefault();
            const errEl = document.getElementById('login-error');
            errEl.classList.add('hidden');
            
            try {
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                await window.api.signInWithEmailAndPassword(window.api.auth, email, password);
            } catch (err) {
                console.error(err);
                errEl.innerText = "登入失敗: " + err.message;
                errEl.classList.remove('hidden');
            }
        };

        function handleLogout() {
            window.api.signOut(window.api.auth);
        }

        // 同步 Firestore 數據
        function startDataSync() {
            const listEl = document.getElementById('data-list');
            window.api.onSnapshot(window.api.collection(window.api.db, "suppliers"), (snap) => {
                listEl.innerHTML = snap.empty ? '<p class="text-center py-10 text-slate-400">目前沒有資料</p>' : '';
                snap.forEach(doc => {
                    const data = doc.data();
                    listEl.innerHTML += `
                        <div class="bg-white p-4 rounded-lg border shadow-sm flex justify-between items-center">
                            <div>
                                <div class="font-bold">${data.name_cn || '未命名'}</div>
                                <div class="text-xs text-slate-400">${data.tags || '無工種'}</div>
                            </div>
                            <button onclick="deleteDoc('${doc.id}')" class="text-red-400 p-2"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                    `;
                });
                lucide.createIcons();
            });
        }

        async function saveData() {
            const name = document.getElementById('new-cn').value;
            const tags = document.getElementById('new-tags').value;
            if(!name) return alert("請輸入名稱");
            try {
                await window.api.addDoc(window.api.collection(window.api.db, "suppliers"), {
                    name_cn: name,
                    tags: tags,
                    createdAt: Date.now()
                });
                document.getElementById('new-cn').value = '';
                document.getElementById('new-tags').value = '';
            } catch (e) { alert("儲存失敗: " + e.message); }
        }

        async function deleteDoc(id) {
            if(!confirm("確定刪除？")) return;
            await window.api.deleteDoc(window.api.doc(window.api.db, "suppliers", id));
        }

        lucide.createIcons();
    </script>
</body>
</html>
