<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>集團供應商與承判商管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
        import { getFirestore, collection, doc, addDoc, getDocs, onSnapshot, query, deleteDoc, updateDoc, writeBatch, where, orderBy } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

        // 你的 Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyCSiZp1Hi190zR-fzP_B8JoftTjFHC8dSs",
            authDomain: "supplier-system-60c1b.firebaseapp.com",
            databaseURL: "https://supplier-system-60c1b-default-rtdb.firebaseio.com",
            projectId: "supplier-system-60c1b",
            storageBucket: "supplier-system-60c1b.firebasestorage.app",
            messagingSenderId: "101078681344",
            appId: "1:101078681344:web:34933bff027e79d0f1d5e5",
            measurementId: "G-D0P8QGW3X9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        window.firebaseCtx = { db, auth, signInWithEmailAndPassword, signOut, collection, doc, addDoc, getDocs, onSnapshot, query, deleteDoc, updateDoc, writeBatch, where, orderBy };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('main-view').classList.remove('hidden');
                document.getElementById('user-email').innerText = user.email;
                if(window.initApp) window.initApp();
            } else {
                document.getElementById('login-view').classList.remove('hidden');
                document.getElementById('main-view').classList.add('hidden');
            }
        });
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
        .loading-overlay { background: rgba(255,255,255,0.8); backdrop-filter: blur(4px); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="app" class="min-h-screen flex flex-col">
        <!-- 登入界面 -->
        <div id="login-view" class="flex-grow flex items-center justify-center p-4">
            <div class="bg-white p-8 rounded-2xl shadow-xl border max-w-md w-full">
                <div class="flex flex-col items-center mb-8">
                    <div class="bg-blue-600 p-3 rounded-xl mb-4 text-white"><i data-lucide="shield-check" class="w-8 h-8"></i></div>
                    <h1 class="text-2xl font-bold">內部供應商管理系統</h1>
                </div>
                <form id="login-form" class="space-y-4">
                    <input type="email" id="email" required placeholder="帳號 Email" class="w-full px-4 py-3 rounded-lg border outline-none focus:ring-2 focus:ring-blue-500">
                    <input type="password" id="password" required placeholder="密碼" class="w-full px-4 py-3 rounded-lg border outline-none focus:ring-2 focus:ring-blue-500">
                    <div id="login-error" class="text-red-500 text-xs hidden">登入失敗，請檢查帳號密碼。</div>
                    <button type="submit" id="login-btn" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700 transition shadow-lg shadow-blue-200">登入雲端系統</button>
                </form>
            </div>
        </div>

        <!-- 主界面 -->
        <div id="main-view" class="hidden flex-grow flex flex-col">
            <nav class="bg-white border-b px-6 py-4 sticky top-0 z-20 flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <div class="bg-blue-600 p-1.5 rounded text-white"><i data-lucide="database" class="w-5 h-5"></i></div>
                    <span class="font-bold text-lg">集團雲端查核系統</span>
                </div>
                <div class="flex items-center gap-4">
                    <button onclick="switchTab('search')" class="tab-btn px-3 py-1 rounded-md bg-blue-50 text-blue-600 font-bold" data-tab="search">查詢</button>
                    <button onclick="switchTab('manage')" class="tab-btn px-3 py-1 text-slate-600" data-tab="manage">管理</button>
                    <button onclick="switchTab('entities')" class="tab-btn px-3 py-1 text-slate-600" data-tab="entities">實體設定</button>
                    <button onclick="switchTab('conflicts')" class="tab-btn px-3 py-1 text-slate-600" data-tab="conflicts">衝突</button>
                    <div class="h-6 w-px bg-slate-200 ml-2"></div>
                    <div class="hidden md:block text-xs text-slate-400 font-bold" id="user-email"></div>
                    <button onclick="handleLogout()" class="text-slate-400 hover:text-red-500"><i data-lucide="log-out" class="w-5 h-5"></i></button>
                </div>
            </nav>

            <div class="p-6 max-w-7xl mx-auto w-full flex-grow">
                
                <!-- 1. 查詢分頁 -->
                <div id="tab-search" class="tab-content">
                    <div class="bg-white p-8 rounded-2xl border shadow-sm text-center mb-6">
                        <h2 class="text-xl font-bold mb-4">全域即時搜尋</h2>
                        <div class="relative max-w-2xl mx-auto">
                            <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                            <input type="text" id="global-search" placeholder="搜尋供應商名稱或關鍵字..." class="w-full pl-12 pr-4 py-3 bg-slate-50 rounded-xl border-none ring-1 ring-slate-200 focus:ring-2 focus:ring-blue-500 transition outline-none">
                        </div>
                    </div>
                    <div id="search-results" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
                </div>

                <!-- 2. 管理分頁 -->
                <div id="tab-manage" class="tab-content hidden">
                    <div class="flex flex-col lg:flex-row gap-6">
                        <div class="lg:w-1/3 space-y-4">
                            <div class="bg-white p-5 rounded-xl border shadow-sm">
                                <h3 class="font-bold flex items-center gap-2 mb-4"><i data-lucide="plus-circle" class="text-blue-600"></i> 新增/導入</h3>
                                <div class="space-y-3">
                                    <select id="import-entity" class="w-full border p-2 rounded text-sm outline-none bg-slate-50 font-bold border-blue-200"></select>
                                    <div class="flex gap-2">
                                        <input type="text" id="m-name-cn" placeholder="中文名稱" class="w-1/2 border p-2 rounded text-sm outline-none focus:ring-1 focus:ring-blue-500">
                                        <input type="text" id="m-name-en" placeholder="英文名稱" class="w-1/2 border p-2 rounded text-sm outline-none focus:ring-1 focus:ring-blue-500">
                                    </div>
                                    <div class="flex gap-2">
                                        <select id="m-type" class="w-1/3 border p-2 rounded text-sm outline-none focus:ring-1 focus:ring-blue-500"><option value="供應商">供應商</option><option value="承判商">承判商</option></select>
                                        <select id="m-status" class="w-1/3 border p-2 rounded text-sm outline-none focus:ring-1 focus:ring-blue-500"><option value="活躍">活躍</option><option value="暫停">暫停</option><option value="黑名單">黑名單</option></select>
                                        <input type="text" id="m-phone" placeholder="電話" class="w-1/3 border p-2 rounded text-sm outline-none focus:ring-1 focus:ring-blue-500">
                                    </div>
                                    <input type="text" id="m-tags" placeholder="工種 (如: 五金, 機電)" class="w-full border p-2 rounded text-sm outline-none focus:ring-1 focus:ring-blue-500">
                                    <textarea id="m-note" placeholder="備註" class="w-full border p-2 rounded text-sm outline-none h-16 focus:ring-1 focus:ring-blue-500"></textarea>
                                    <button onclick="handleManualAdd()" class="w-full bg-blue-600 text-white py-2 rounded font-bold text-sm hover:bg-blue-700">確認手動新增</button>
                                    <div class="relative border-2 border-dashed border-slate-200 rounded-lg p-4 text-center mt-2 hover:bg-slate-50 transition cursor-pointer">
                                        <input type="file" id="excel-file" class="absolute inset-0 opacity-0 cursor-pointer" accept=".xlsx, .xls">
                                        <p class="text-xs text-slate-500 font-medium">點擊在此上傳 Excel 批量導入</p>
                                    </div>
                                    <button onclick="downloadTemplate()" class="w-full text-xs text-blue-500 hover:underline">下載 Excel 標準範本</button>
                                </div>
                            </div>
                        </div>
                        <div class="lg:w-2/3">
                            <div class="bg-white p-4 rounded-xl border shadow-sm mb-4">
                                <div class="grid grid-cols-1 sm:grid-cols-5 gap-3">
                                    <div class="relative sm:col-span-1">
                                        <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 w-4 h-4"></i>
                                        <input type="text" id="manage-search" placeholder="搜尋..." class="w-full pl-9 pr-3 py-2 border rounded-lg text-sm outline-none focus:ring-1 focus:ring-blue-500">
                                    </div>
                                    <select id="filter-entity" class="border p-2 rounded-lg text-sm outline-none sm:col-span-1"><option value="">所有實體</option></select>
                                    <select id="filter-status" class="border p-2 rounded-lg text-sm outline-none sm:col-span-1">
                                        <option value="">所有狀態</option>
                                        <option value="活躍">活躍</option>
                                        <option value="暫停">暫停</option>
                                        <option value="黑名單">黑名單</option>
                                    </select>
                                    <select id="filter-type" class="border p-2 rounded-lg text-sm outline-none sm:col-span-1">
                                        <option value="">所有類型</option>
                                        <option value="供應商">供應商</option>
                                        <option value="承判商">承判商</option>
                                    </select>
                                    <button onclick="executeExport()" class="bg-green-600 text-white px-4 py-2 rounded-lg text-sm font-bold flex items-center justify-center gap-2 hover:bg-green-700 sm:col-span-1">
                                        <i data-lucide="download-cloud" class="w-4 h-4"></i> 導出結果
                                    </button>
                                </div>
                            </div>
                            <div class="bg-white border rounded-xl shadow-sm flex flex-col">
                                <div class="overflow-x-auto">
                                    <table class="w-full text-left">
                                        <thead class="bg-slate-50 border-b">
                                            <tr class="text-[11px] font-bold text-slate-500 uppercase tracking-wider">
                                                <th class="p-4">實體 / 名稱</th>
                                                <th class="p-4">狀態/類型</th>
                                                <th class="p-4">工種</th>
                                                <th class="p-4 text-right">操作</th>
                                            </tr>
                                        </thead>
                                        <tbody id="manage-table-body" class="text-sm"></tbody>
                                    </table>
                                </div>
                                <div id="manage-pagination" class="flex justify-between items-center p-4 bg-white border-t rounded-b-xl"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 3. 實體設定分頁 -->
                <div id="tab-entities" class="tab-content hidden">
                    <div class="max-w-2xl mx-auto">
                        <div class="bg-white p-6 rounded-2xl border shadow-sm">
                            <h2 class="text-xl font-bold mb-4 flex items-center gap-2"><i data-lucide="settings" class="text-slate-600"></i> 集團實體管理</h2>
                            <p class="text-sm text-slate-500 mb-6">設定實體並指定母公司。</p>
                            <div class="flex gap-2 mb-6">
                                <input type="text" id="new-entity-name" placeholder="輸入新實體名稱" class="flex-grow border px-4 py-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                                <button onclick="handleAddEntity()" class="bg-slate-900 text-white px-6 py-2 rounded-lg font-bold hover:bg-slate-800 transition">新增</button>
                            </div>
                            <div class="space-y-2" id="entities-list"></div>
                        </div>
                    </div>
                </div>

                <!-- 4. 衝突報告分頁 -->
                <div id="tab-conflicts" class="tab-content hidden">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-xl font-bold flex items-center gap-2 text-red-600"><i data-lucide="alert-triangle"></i> 跨實體衝突掃描</h2>
                        <button onclick="exportConflictReport()" class="bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-2 hover:bg-red-700 transition">
                            <i data-lucide="download" class="w-4 h-4"></i> 導出衝突報告
                        </button>
                    </div>
                    <div class="bg-white p-4 rounded-xl border shadow-sm mb-6 flex gap-4 items-center flex-wrap sm:flex-nowrap">
                        <div class="font-bold text-slate-700 text-sm whitespace-nowrap">實體比對：</div>
                        <select id="conflict-filter-a" class="border p-2 rounded-lg text-sm outline-none flex-grow sm:w-1/3 bg-blue-50 font-medium"></select>
                        <i data-lucide="arrow-right-left" class="text-slate-400 w-5 h-5 mx-2 hidden sm:block"></i>
                        <select id="conflict-filter-b" class="border p-2 rounded-lg text-sm outline-none flex-grow sm:w-1/3"></select>
                        <button onclick="renderConflicts()" class="bg-slate-800 text-white px-6 py-2 rounded-lg text-sm font-bold hover:bg-slate-900 transition">掃描查詢</button>
                    </div>
                    <div id="conflict-list" class="space-y-4"></div>
                </div>
            </div>
        </div>

        <!-- 編輯 Modal -->
        <div id="edit-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
            <div class="bg-white p-6 rounded-xl w-full max-w-md shadow-xl">
                <h3 class="font-bold text-lg mb-4 flex items-center gap-2"><i data-lucide="edit-3" class="text-blue-600"></i> 修改資料</h3>
                <input type="hidden" id="edit-id">
                <div class="space-y-3">
                    <input type="text" id="edit-name-cn" placeholder="中文" class="w-full border p-2 rounded text-sm outline-none">
                    <input type="text" id="edit-name-en" placeholder="英文" class="w-full border p-2 rounded text-sm outline-none">
                    <div class="flex gap-2">
                        <select id="edit-type" class="w-1/2 border p-2 rounded text-sm outline-none"><option value="供應商">供應商</option><option value="承判商">承判商</option></select>
                        <select id="edit-status" class="w-1/2 border p-2 rounded text-sm outline-none"><option value="活躍">活躍</option><option value="暫停">暫停</option><option value="黑名單">黑名單</option></select>
                    </div>
                    <input type="text" id="edit-tags" placeholder="工種" class="w-full border p-2 rounded text-sm outline-none">
                    <input type="text" id="edit-phone" placeholder="電話" class="w-full border p-2 rounded text-sm outline-none">
                    <textarea id="edit-note" placeholder="備註" class="w-full border p-2 rounded text-sm outline-none h-16"></textarea>
                    <div class="flex gap-2 pt-2">
                        <button onclick="closeEditModal()" class="w-1/2 bg-slate-100 py-2 rounded font-bold text-sm">取消</button>
                        <button onclick="saveEdit()" class="w-1/2 bg-blue-600 text-white py-2 rounded font-bold text-sm">儲存修改</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="loading" class="hidden fixed inset-0 z-[100] flex items-center justify-center loading-overlay">
            <div class="bg-white p-6 rounded-2xl shadow-2xl flex flex-col items-center">
                <div class="animate-spin text-blue-600 mb-2"><i data-lucide="refresh-cw" class="w-8 h-8"></i></div>
                <p class="font-bold text-sm">處理中...</p>
            </div>
        </div>
    </div>

    <script>
        let supplierData = [];
        let entityList = [];
        let entityDocs = {};
        let parentEntityName = "";
        let currentPage = 1;
        const itemsPerPage = 10;
        
        lucide.createIcons();

        document.getElementById('login-form').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('login-btn');
            btn.disabled = true;
            btn.innerText = "驗證中...";
            try {
                await window.firebaseCtx.signInWithEmailAndPassword(window.firebaseCtx.auth, email, password);
            } catch (err) {
                document.getElementById('login-error').classList.remove('hidden');
                btn.disabled = false;
                btn.innerText = "登入雲端系統";
            }
        };

        function handleLogout() { window.firebaseCtx.signOut(window.firebaseCtx.auth); }

        window.initApp = function() {
            const { db, collection, onSnapshot, query, orderBy } = window.firebaseCtx;
            onSnapshot(collection(db, "entities"), (snap) => {
                entityList = []; entityDocs = {}; parentEntityName = "";
                let hasParent = false;
                snap.forEach(d => {
                    const data = d.data();
                    entityList.push(data.name);
                    entityDocs[data.name] = d.id;
                    if (data.isParent) { parentEntityName = data.name; hasParent = true; }
                });
                if(entityList.length === 0) {
                    ['母公司', '子公司 01'].forEach(async (name, index) => {
                        await window.firebaseCtx.addDoc(collection(db, "entities"), { name, isParent: index === 0 });
                    });
                } else {
                    entityList.sort();
                    if (!hasParent && entityList.length > 0) parentEntityName = entityList[0];
                    updateEntityUIs();
                }
            });

            onSnapshot(query(collection(db, "suppliers"), orderBy("timestamp", "desc")), (snap) => {
                supplierData = [];
                snap.forEach(d => supplierData.push({ id: d.id, ...d.data() }));
                renderAll();
            });
        };

        function toggleLoading(show) { document.getElementById('loading').classList.toggle('hidden', !show); }

        function updateEntityUIs() {
            const ids = ['import-entity', 'filter-entity'];
            ids.forEach(id => {
                const el = document.getElementById(id);
                if (!el) return;
                const cur = el.value;
                el.innerHTML = id === 'filter-entity' ? '<option value="">所有實體</option>' : '';
                entityList.forEach(e => el.innerHTML += `<option value="${e}">${e}</option>`);
                if(cur && entityList.includes(cur)) el.value = cur;
                else if (id === 'import-entity' && entityList.length > 0) el.value = entityList[0];
            });

            const list = document.getElementById('entities-list');
            if (list) {
                list.innerHTML = '';
                entityList.forEach((e) => {
                    const isParent = e === parentEntityName;
                    list.innerHTML += `
                        <div class="flex justify-between items-center p-3 bg-slate-50 rounded-lg border">
                            <label class="flex items-center gap-3 cursor-pointer">
                                <input type="radio" name="parentEntity" ${isParent ? 'checked' : ''} onchange="setParentEntity('${e}')">
                                <span class="font-bold ${isParent ? 'text-blue-600' : ''}">${e}</span>
                            </label>
                            <div class="flex gap-2">
                                <button onclick="editEntity('${e}')" class="text-slate-300 hover:text-blue-500"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
                                <button onclick="removeEntity('${e}')" class="text-slate-300 hover:text-red-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                            </div>
                        </div>
                    `;
                });
            }

            const ca = document.getElementById('conflict-filter-a');
            const cb = document.getElementById('conflict-filter-b');
            if (ca && cb) {
                const valA = ca.value, valB = cb.value;
                ca.innerHTML = ''; cb.innerHTML = '<option value="">所有其他子公司</option>';
                entityList.forEach(e => {
                    const label = e === parentEntityName ? `${e} (母公司)` : e;
                    ca.innerHTML += `<option value="${e}">${label}</option>`;
                    cb.innerHTML += `<option value="${e}">${label}</option>`;
                });
                ca.value = valA && entityList.includes(valA) ? valA : parentEntityName;
                if (valB && entityList.includes(valB)) cb.value = valB;
            }
            lucide.createIcons();
        }

        async function setParentEntity(name) {
            toggleLoading(true);
            const { db, doc, writeBatch } = window.firebaseCtx;
            const batch = writeBatch(db);
            entityList.forEach(e => batch.update(doc(db, "entities", entityDocs[e]), { isParent: e === name }));
            await batch.commit();
            toggleLoading(false);
        }

        async function handleAddEntity() {
            const val = document.getElementById('new-entity-name').value.trim();
            if (!val || entityList.includes(val)) return;
            toggleLoading(true);
            await window.firebaseCtx.addDoc(window.firebaseCtx.collection(window.firebaseCtx.db, "entities"), { name: val, isParent: false });
            document.getElementById('new-entity-name').value = '';
            toggleLoading(false);
        }

        function getStatusStyle(s) {
            if (s === "黑名單") return "text-red-600 bg-red-50 border-red-200";
            if (s === "暫停") return "text-amber-600 bg-amber-50 border-amber-200";
            return "text-green-600 bg-green-50 border-green-200";
        }
        function getTypeStyle(t) { return t === "承判商" ? "text-purple-600 bg-purple-50 border-purple-200" : "text-blue-600 bg-blue-50 border-blue-200"; }

        // --- 核心過濾器邏輯 (管理頁面) ---
        function getFilteredData() {
            const q = document.getElementById('manage-search').value.toLowerCase();
            const fE = document.getElementById('filter-entity').value;
            const fS = document.getElementById('filter-status').value;
            const fT = document.getElementById('filter-type').value;
            return supplierData.filter(s => {
                const mk = (s.name_cn||"").toLowerCase().includes(q) || (s.name_en||"").toLowerCase().includes(q) || (s.tags||"").toLowerCase().includes(q);
                return mk && (fE === "" || s.entity === fE) && (fS === "" || s.status === fS) && (fT === "" || s.type === fT);
            });
        }

        function renderManageTable() {
            const tbody = document.getElementById('manage-table-body');
            const filtered = getFilteredData();
            const totalPages = Math.ceil(filtered.length / itemsPerPage) || 1;
            if (currentPage > totalPages) currentPage = totalPages;
            const paginated = filtered.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage);

            tbody.innerHTML = paginated.length ? '' : '<tr><td colspan="4" class="text-center p-8 text-slate-400">沒有資料</td></tr>';
            paginated.forEach(s => {
                tbody.innerHTML += `
                    <tr class="border-b hover:bg-slate-50 transition">
                        <td class="p-4">
                            <div class="text-[10px] font-bold text-blue-500 uppercase">${s.entity}</div>
                            <div class="font-bold text-slate-800">${s.name_cn || '-'}</div>
                            <div class="text-xs text-slate-400">${s.name_en || '-'}</div>
                        </td>
                        <td class="p-4"><span class="px-2 py-0.5 rounded border text-[10px] font-bold ${getStatusStyle(s.status)}">${s.status}</span></td>
                        <td class="p-4 text-xs text-slate-500">${s.tags || '-'}</td>
                        <td class="p-4 text-right">
                            <button onclick="openEditModal('${s.id}')" class="p-2 text-blue-400"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                            <button onclick="deleteItem('${s.id}')" class="p-2 text-red-300"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </td>
                    </tr>`;
            });
            document.getElementById('manage-pagination').innerHTML = `
                <div class="text-sm text-slate-500">共 ${filtered.length} 筆</div>
                <div class="flex gap-2">
                    <button onclick="changePage(-1)" ${currentPage===1?'disabled':''} class="px-3 py-1 border rounded text-xs">上一頁</button>
                    <button onclick="changePage(1)" ${currentPage===totalPages?'disabled':''} class="px-3 py-1 border rounded text-xs">下一頁</button>
                </div>`;
            lucide.createIcons();
        }

        window.changePage = (d) => { currentPage += d; renderManageTable(); };

        function renderSearch() {
            const container = document.getElementById('search-results');
            const query = document.getElementById('global-search').value.trim().toLowerCase();
            container.innerHTML = '';
            if (query === "") return;
            supplierData.filter(s => (s.name_cn||"").toLowerCase().includes(query) || (s.name_en||"").toLowerCase().includes(query) || (s.tags||"").toLowerCase().includes(query)).forEach(s => {
                container.innerHTML += `<div class="bg-white p-5 rounded-2xl border shadow-sm"><h4 class="font-bold">${s.name_cn || '-'}</h4><p class="text-xs text-slate-400">${s.name_en}</p></div>`;
            });
        }

        // --- 修正後的導出邏輯 (解決錯位與視窗問題) ---
        window.executeExport = function() {
            const filteredData = getFilteredData();
            if (filteredData.length === 0) return alert("當前篩選條件下無任何資料可導出。");

            // 準備數據
            const exportRows = filteredData.map(s => ({
                "實體": s.entity || "",
                "中文名稱": s.name_cn || "",
                "英文名稱": s.name_en || "",
                "類型": s.type || "",
                "狀態": s.status || "",
                "工種": s.tags || "", // SheetJS 會自動處理內部的逗號，不會造成錯位
                "電話": s.phone || "",
                "備註": s.note || ""
            }));

            // 使用 XLSX 庫生成檔案
            const worksheet = XLSX.utils.json_to_sheet(exportRows);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "供應商名單");

            // 執行下載
            const fileName = `管理頁面篩選結果_${new Date().toISOString().slice(0, 10)}.xlsx`;
            XLSX.writeFile(workbook, fileName);
        };

        window.downloadTemplate = () => {
            const ws = XLSX.utils.aoa_to_sheet([["中文名稱", "英文名稱", "類型", "狀態", "工種", "聯絡電話", "備註"], ["範例公司", "Example", "供應商", "活躍", "五金,水泵", "12345678", ""]]);
            const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Template");
            XLSX.writeFile(wb, "供應商導入範本.xlsx");
        };

        function switchTab(t) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
            document.getElementById(`tab-${t}`).classList.remove('hidden');
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.className = "tab-btn px-3 py-1 text-slate-600";
                if(b.dataset.tab === t) b.className = "tab-btn px-3 py-1 rounded-md bg-blue-50 text-blue-600 font-bold";
            });
            if(t === 'conflicts') renderConflicts();
        }

        async function handleManualAdd() {
            const item = {
                name_cn: document.getElementById('m-name-cn').value,
                name_en: document.getElementById('m-name-en').value,
                type: document.getElementById('m-type').value,
                status: document.getElementById('m-status').value,
                tags: document.getElementById('m-tags').value,
                phone: document.getElementById('m-phone').value,
                note: document.getElementById('m-note').value,
                entity: document.getElementById('import-entity').value,
                timestamp: Date.now()
            };
            if(!item.name_cn && !item.name_en) return alert("請輸入名稱");
            toggleLoading(true);
            await window.firebaseCtx.addDoc(window.firebaseCtx.collection(window.firebaseCtx.db, "suppliers"), item);
            toggleLoading(false);
            ['m-name-cn','m-name-en','m-tags','m-phone','m-note'].forEach(i=>document.getElementById(i).value='');
        }

        function renderAll() { renderSearch(); renderManageTable(); }
        async function deleteItem(id) { if(confirm("確定刪除？")) await window.firebaseCtx.deleteDoc(window.firebaseCtx.doc(window.firebaseCtx.db, "suppliers", id)); }
        function openEditModal(id) {
            const s = supplierData.find(x=>x.id===id);
            if(!s) return;
            document.getElementById('edit-id').value = s.id;
            document.getElementById('edit-name-cn').value = s.name_cn || '';
            document.getElementById('edit-name-en').value = s.name_en || '';
            document.getElementById('edit-type').value = s.type;
            document.getElementById('edit-status').value = s.status;
            document.getElementById('edit-tags').value = s.tags || '';
            document.getElementById('edit-phone').value = s.phone || '';
            document.getElementById('edit-note').value = s.note || '';
            document.getElementById('edit-modal').classList.remove('hidden');
        }
        function closeEditModal() { document.getElementById('edit-modal').classList.add('hidden'); }
        async function saveEdit() {
            const id = document.getElementById('edit-id').value;
            const data = {
                name_cn: document.getElementById('edit-name-cn').value,
                name_en: document.getElementById('edit-name-en').value,
                type: document.getElementById('edit-type').value,
                status: document.getElementById('edit-status').value,
                tags: document.getElementById('edit-tags').value,
                phone: document.getElementById('edit-phone').value,
                note: document.getElementById('edit-note').value,
            };
            toggleLoading(true);
            await window.firebaseCtx.updateDoc(window.firebaseCtx.doc(window.firebaseCtx.db, "suppliers", id), data);
            toggleLoading(false); closeEditModal();
        }

        document.getElementById('excel-file').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const entity = document.getElementById('import-entity').value;
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(evt) {
                const workbook = XLSX.read(new Uint8Array(evt.target.result), { type: 'array' });
                const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                toggleLoading(true);
                for (const row of rows) {
                    await window.firebaseCtx.addDoc(window.firebaseCtx.collection(window.firebaseCtx.db, "suppliers"), {
                        name_cn: row["中文名稱"] || "", name_en: row["英文名稱"] || "",
                        type: row["類型"] || "供應商", status: row["狀態"] || "活躍",
                        tags: row["工種"] || "", phone: row["聯絡電話"] || "",
                        note: row["備註"] || "", entity: entity, timestamp: Date.now()
                    });
                }
                toggleLoading(false); alert("導入成功");
            };
            reader.readAsArrayBuffer(file);
        });

        function getConflictPairs() {
            const norm = (s) => (s||"").toLowerCase().replace(/\s+/g,'').replace(/(limited|ltd|co|有限公司|公司)/g,"");
            const filterA = document.getElementById('conflict-filter-a').value || parentEntityName;
            const filterB = document.getElementById('conflict-filter-b').value;
            const groupA = supplierData.filter(s => s.entity === filterA);
            const groupB = supplierData.filter(s => filterB ? s.entity === filterB : s.entity !== filterA);
            const res = [];
            for(let a of groupA) {
                for(let b of groupB) {
                    if(a.entity !== b.entity && (norm(a.name_cn) === norm(b.name_cn) || (a.name_en && b.name_en && norm(a.name_en) === norm(b.name_en)))) res.push({a, b});
                }
            }
            return res;
        }

        window.renderConflicts = function() {
            const list = document.getElementById('conflict-list');
            const pairs = getConflictPairs();
            list.innerHTML = pairs.length ? '' : '<p class="text-center py-10 text-green-600">未發現衝突</p>';
            pairs.forEach(p => {
                list.innerHTML += `<div class="bg-white border-l-4 border-red-500 p-4 rounded shadow-sm flex justify-between"><div>${p.a.entity}: ${p.a.name_cn}</div><div>${p.b.entity}: ${p.b.name_cn}</div></div>`;
            });
            lucide.createIcons();
        }

        window.exportConflictReport = function() {
            const pairs = getConflictPairs();
            if(!pairs.length) return alert("無衝突可導出");
            const data = pairs.map(p => ({ "實體A": p.a.entity, "名稱A": p.a.name_cn, "實體B": p.b.entity, "名稱B": p.b.name_cn }));
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Conflicts");
            XLSX.writeFile(wb, "衝突報告.xlsx");
        }

        document.getElementById('global-search').oninput = renderSearch;
        document.getElementById('manage-search').oninput = () => { currentPage = 1; renderManageTable(); };
        document.getElementById('filter-entity').onchange = () => { currentPage = 1; renderManageTable(); };
        document.getElementById('filter-status').onchange = () => { currentPage = 1; renderManageTable(); };
        document.getElementById('filter-type').onchange = () => { currentPage = 1; renderManageTable(); };
    </script>
</body>
</html>
