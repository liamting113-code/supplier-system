<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>集團供應商管理系統 - 診斷版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

        // ⚠️ 重要：請確保這裡的資料與 Firebase Console 的 Project Settings 一致
        const firebaseConfig = {
            apiKey: "BJqAVUco0zEucgcAZEzZRt9N6D7jXXrtMuMH1O9fsPMMNpNaXFwGKFwTiwKTWZU8b_Ee2x8ewcmxd8o_SzU4zYMY",
            authDomain: "你的AUTH_DOMAIN",
            projectId: "你的PROJECT_ID",
            storageBucket: "你的STORAGE_BUCKET",
            messagingSenderId: "你的SENDER_ID",
            appId: "你的APP_ID"
        };

        // 診斷：檢查是否漏填
        if (firebaseConfig.apiKey.includes("你的")) {
            alert("錯誤：你還沒有在代碼中填入真實的 Firebase API Key！請修改 index.html 第 16-21 行。");
        }

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.api = { auth, db, signInWithEmailAndPassword, signOut, collection, addDoc, onSnapshot, doc, deleteDoc, query, orderBy };

        onAuthStateChanged(auth, (user) => {
            const loginView = document.getElementById('login-view');
            const mainView = document.getElementById('main-view');
            const statusDot = document.getElementById('conn-status');
            
            if (user) {
                loginView.classList.add('hidden');
                mainView.classList.remove('hidden');
                statusDot.classList.replace('bg-red-500', 'bg-green-500');
                startDataSync();
            } else {
                loginView.classList.remove('hidden');
                mainView.classList.add('hidden');
                statusDot.classList.replace('bg-green-500', 'bg-red-500');
            }
        });
    </script>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="app" class="min-h-screen flex flex-col">
        <!-- 登入界面 -->
        <div id="login-view" class="flex-grow flex items-center justify-center p-4">
            <div class="bg-white p-8 rounded-2xl shadow-xl border max-w-md w-full">
                <div class="flex flex-col items-center mb-6">
                    <div class="bg-blue-600 p-3 rounded-xl mb-4 text-white"><i data-lucide="shield-check" class="w-8 h-8"></i></div>
                    <h1 class="text-2xl font-bold">供應商管理系統</h1>
                    <p class="text-xs text-slate-400 mt-2">已偵測到環境：GitHub Pages</p>
                </div>
                <form id="login-form" class="space-y-4">
                    <input type="email" id="email" required placeholder="Email" class="w-full px-4 py-3 rounded-lg border outline-none focus:ring-2 focus:ring-blue-500">
                    <input type="password" id="password" required placeholder="Password" class="w-full px-4 py-3 rounded-lg border outline-none focus:ring-2 focus:ring-blue-500">
                    <div id="login-error" class="text-red-500 text-xs bg-red-50 p-3 rounded border border-red-100 hidden whitespace-pre-wrap"></div>
                    <button type="submit" id="login-btn" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700 transition flex justify-center items-center gap-2">
                        登入系統
                    </button>
                </form>
            </div>
        </div>

        <!-- 主界面 -->
        <div id="main-view" class="hidden flex-grow flex flex-col">
            <nav class="bg-white border-b px-6 py-4 flex justify-between items-center sticky top-0 z-50">
                <div class="flex items-center gap-3">
                    <div id="conn-status" class="w-3 h-3 rounded-full bg-red-500" title="連線狀態"></div>
                    <span class="font-bold">集團查核系統 (正式連線)</span>
                </div>
                <button onclick="handleLogout()" class="text-slate-400 hover:text-red-500 transition"><i data-lucide="log-out" class="w-5 h-5"></i></button>
            </nav>

            <div class="p-6 max-w-4xl mx-auto w-full">
                <div class="bg-white p-6 rounded-2xl border mb-6 shadow-sm">
                    <h3 class="font-bold mb-4">新增數據測試</h3>
                    <div class="flex gap-2">
                        <input type="text" id="new-name" placeholder="公司名稱" class="flex-grow border p-2 rounded-lg">
                        <button onclick="saveData()" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold">儲存</button>
                    </div>
                </div>
                <div id="data-list" class="space-y-2"></div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('login-form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const errEl = document.getElementById('login-error');
            btn.disabled = true;
            btn.innerText = "驗證中...";
            errEl.classList.add('hidden');
            
            try {
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                await window.api.signInWithEmailAndPassword(window.api.auth, email, password);
            } catch (err) {
                console.error("Firebase Error Details:", err);
                errEl.innerText = "登入失敗原因：\n" + err.code + "\n" + err.message;
                errEl.classList.remove('hidden');
                btn.disabled = false;
                btn.innerText = "登入系統";
            }
        };

        function handleLogout() {
            window.api.signOut(window.api.auth);
        }

        function startDataSync() {
            const listEl = document.getElementById('data-list');
            window.api.onSnapshot(window.api.collection(window.api.db, "suppliers"), (snap) => {
                listEl.innerHTML = snap.empty ? '<p class="text-slate-400 text-center py-10">資料庫目前是空的</p>' : '';
                snap.forEach(docSnap => {
                    const data = docSnap.data();
                    listEl.innerHTML += `
                        <div class="bg-white p-4 rounded-xl border flex justify-between items-center">
                            <span class="font-bold">${data.name || '無名'}</span>
                            <button onclick="deleteDoc('${docSnap.id}')" class="text-red-400 hover:text-red-600"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                    `;
                });
                lucide.createIcons();
            });
        }

        async function saveData() {
            const name = document.getElementById('new-name').value;
            if(!name) return;
            try {
                await window.api.addDoc(window.api.collection(window.api.db, "suppliers"), { name, createdAt: Date.now() });
                document.getElementById('new-name').value = '';
            } catch (e) { alert("儲存失敗，請檢查 Firestore Rules：" + e.message); }
        }

        async function deleteDoc(id) {
            await window.api.deleteDoc(window.api.doc(window.api.db, "suppliers", id));
        }
        lucide.createIcons();
    </script>
</body>
</html>
