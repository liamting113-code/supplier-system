<!DOCTYPE html>

        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
        import { getFirestore, collection, doc, addDoc, getDocs, onSnapshot, query, deleteDoc, updateDoc, writeBatch, where, orderBy } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

        // 你的 Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyCSiZp1Hi190zR-fzP_B8JoftTjFHC8dSs",
            authDomain: "supplier-system-60c1b.firebaseapp.com",
            databaseURL: "https://supplier-system-60c1b-default-rtdb.firebaseio.com",
            projectId: "supplier-system-60c1b",
            storageBucket: "supplier-system-60c1b.firebasestorage.app",
            messagingSenderId: "101078681344",
            appId: "1:101078681344:web:34933bff027e79d0f1d5e5",
            measurementId: "G-D0P8QGW3X9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        // 將 Firebase 功能掛載到 window，讓 HTML 可以呼叫
        window.firebaseCtx = { db, auth, signInWithEmailAndPassword, signOut, collection, doc, addDoc, getDocs, onSnapshot, query, deleteDoc, updateDoc, writeBatch, where, orderBy };

        // 監聽登入狀態
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('main-view').classList.remove('hidden');
                document.getElementById('user-email').innerText = user.email;
                if(window.initApp) window.initApp(); // 啟動雲端資料同步
            } else {
                document.getElementById('login-view').classList.remove('hidden');
                document.getElementById('main-view').classList.add('hidden');
            }
        });
    </script>
    <style>

    <script>
        let supplierData = [];
        let entityList = [];
        let entityDocs = {}; // Mapping of entity Name -> Document ID
        let parentEntityName = ""; // 母公司記錄
        
        // 分頁變數
        let currentPage = 1;
        const itemsPerPage = 10;
        
        lucide.createIcons();

        // 登入邏輯
        document.getElementById('login-form').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('login-btn');
            
            btn.disabled = true;
            btn.innerText = "驗證中...";
            document.getElementById('login-error').classList.add('hidden');
            
            try {
                await window.firebaseCtx.signInWithEmailAndPassword(window.firebaseCtx.auth, email, password);
            } catch (err) {
                document.getElementById('login-error').innerText = "登入失敗：" + err.message;
                document.getElementById('login-error').classList.remove('hidden');
                btn.disabled = false;
                btn.innerText = "登入雲端系統";
            }
        };

        function handleLogout() {
            window.firebaseCtx.signOut(window.firebaseCtx.auth);
        }

        // 初始化資料同步
        window.initApp = function() {
            const { db, collection, onSnapshot, query, orderBy } = window.firebaseCtx;

            // 1. 監聽實體資料庫 (Entities)
            onSnapshot(collection(db, "entities"), (snap) => {
                entityList = [];
                entityDocs = {};
                parentEntityName = "";
                let hasParent = false;
                
                snap.forEach(d => {
                    const data = d.data();
                    entityList.push(data.name);
                    entityDocs[data.name] = d.id;
                    if (data.isParent) {
                        parentEntityName = data.name;
                        hasParent = true;
                    }
                });
                
                // 自動建立預設實體
                if(entityList.length === 0) {
                    const defaultEntities = ['母公司', '子公司 01'];
                    defaultEntities.forEach(async (name, index) => {
                        await window.firebaseCtx.addDoc(collection(db, "entities"), { 
                            name: name,
                            isParent: index === 0 // 第一個自動做母公司
                        });
                    });
                } else {
                    entityList.sort(); // 字母排序
                    if (!hasParent && entityList.length > 0) {
                        parentEntityName = entityList[0]; // 如果無人係母公司，暫時預設第一個
                    }
                    updateEntityUIs();
                }
            });

            // 2. 監聽供應商資料庫 (Suppliers)
            const q = query(collection(db, "suppliers"), orderBy("timestamp", "desc"));
            onSnapshot(q, (snap) => {
                supplierData = [];
                snap.forEach(d => {
                    supplierData.push({ id: d.id, ...d.data() });
                });
                renderAll();
            });
        };

        function toggleLoading(show) {
            document.getElementById('loading').classList.toggle('hidden', !show);
        }

        // --- 實體管理 ---
        function updateEntityUIs() {
            const ids = ['import-entity', 'filter-entity'];
            ids.forEach(id => {
                const el = document.getElementById(id);
                if (!el) return;
                const cur = el.value;
                el.innerHTML = id === 'filter-entity' ? '<option value="">所有實體</option>' : '';
                entityList.forEach(e => el.innerHTML += `<option value="${e}">${e}</option>`);
                if(cur && entityList.includes(cur)) el.value = cur;
                else if (id === 'import-entity' && entityList.length > 0) el.value = entityList[0];
            });

            // 更新實體列表 UI (包含母公司 Radio 按鈕)
            const list = document.getElementById('entities-list');
            if (list) {
                list.innerHTML = '';
                entityList.forEach((e) => {
                    const isParent = e === parentEntityName;
                    list.innerHTML += `
                        <div class="flex justify-between items-center p-3 bg-slate-50 hover:bg-white rounded-lg border transition">
                            <label class="flex items-center gap-3 cursor-pointer">
                                <input type="radio" name="parentEntity" value="${e}" class="w-4 h-4 text-blue-600 focus:ring-blue-500 cursor-pointer" 
                                    ${isParent ? 'checked' : ''} onchange="setParentEntity('${e}')">

        async function editEntity(oldName) {
            const newName = prompt("修改實體名稱：", oldName);
            if (newName && newName.trim() !== "" && newName !== oldName) {
                const trimmedNewName = newName.trim();
                if (entityList.includes(trimmedNewName)) return alert("實體名稱已存在");
                
                toggleLoading(true);
                try {
                    const { db, doc, updateDoc, collection, query, where, getDocs, writeBatch } = window.firebaseCtx;
                    
                    const entityId = entityDocs[oldName];
                    if (entityId) {
                        await updateDoc(doc(db, "entities", entityId), { name: trimmedNewName });
                    }
                    
                    const q = query(collection(db, "suppliers"), where("entity", "==", oldName));
                    const querySnapshot = await getDocs(q);
                    const batch = writeBatch(db);
                    
                    querySnapshot.forEach((d) => {
                        batch.update(d.ref, { entity: trimmedNewName });
                    });
                    await batch.commit();
                } catch (e) { alert("修改失敗: " + e.message); }
                toggleLoading(false);
            }
        }

        // 衝突邏輯 (基於 Filter A 實體 及 Filter B 實體過濾)
        function getConflictPairs() {
            const norm = (s) => (s||"").toLowerCase().replace(/\s+/g,'').replace(/(limited|ltd|co|有限公司|公司)/g,"");
            
            // 讀取過濾條件。如果 Filter A 為空，預設使用母公司名稱
            const filterA = document.getElementById('conflict-filter-a').value || parentEntityName;
            const filterB = document.getElementById('conflict-filter-b').value; // 空值代表所有其他公司
            
            const groupA = supplierData.filter(s => s.entity === filterA);
            const groupB = supplierData.filter(s => filterB ? s.entity === filterB : s.entity !== filterA);
            
            const res = [];
            for(let a of groupA) {
                for(let b of groupB) {
                    if(a.entity !== b.entity && (norm(a.name_cn) === norm(b.name_cn) || (a.name_en && b.name_en && norm(a.name_en) === norm(b.name_en)))) {
                        res.push({a, b});
                    }
                }
            }
            return res;
        }

window.executeDirectExport = function() {

    });

    // 3. 整理成 Excel 格式 (確保「工種」和「備註」在單一單元格內，解決錯位)

    }));

    // 4. 使用 SheetJS (index2.html 已載入) 產生檔案
    const ws = XLSX.utils.json_to_sheet(worksheetData);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "供應商清單");

    // 5. 下載檔案
    const dateStr = new Date().toISOString().slice(0, 10);
    XLSX.writeFile(wb, `集團供應商管理導出_${dateStr}.xlsx`);
};
        

        // 監聽器 (修改過濾條件時將頁碼重置回第一頁)
        document.getElementById('global-search').oninput = renderSearch;
        document.getElementById('manage-search').oninput = () => { currentPage = 1; renderManageTable(); };
        document.getElementById('filter-entity').onchange = () => { currentPage = 1; renderManageTable(); };
        document.getElementById('filter-status').onchange = () => { currentPage = 1; renderManageTable(); };
        document.getElementById('filter-type').onchange = () => { currentPage = 1; renderManageTable(); };
    </script>
</body>
